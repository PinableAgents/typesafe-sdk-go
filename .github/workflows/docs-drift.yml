name: Weekly TypeSafe documentation drift

on:
  schedule:
    - cron: '17 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Reviewed upstream documentation unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check sources without changing the approved lock
        run: python3 scripts/check_doc_drift.py --check --snapshot parity-results/docs-current.json
      - name: Upload observed fingerprints
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: typesafe-doc-drift-${{ github.run_id }}
          path: parity-results/
          retention-days: 14
          if-no-files-found: warn
